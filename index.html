<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubrica</title>
  <!-- bootstrap connection -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <div class="container">
    <div class="row justify-content-center text-center">
      <div class="col-12">
        <h1>Rubrica Contatti</h1>
      </div>
      <div class="col-12 col-md-6 my-5">
        <input type="text" placeholder="Name" id="nameInput" class="w-100">
      </div>
      <div class="col-12 col-md-6 my-5">
        <input type="number" placeholder="Phone Number" id="numberInput" class="w-100">
      </div>
      <div class="col-12 my-5">
        <button class="btn btn-info" id="btnShow">Show Contacts</button>
        <button class="btn btn-success" id="btnAdd">Add Contact</button>
        <button class="btn btn-warning" id="btnRemove">Delete Contact</button>
        <button class="btn btn-secondary" id="btnEdit">Modify Contact</button>
      </div>
      <div class="col-12 containerContacts">

      </div>
    </div>
  </div>


    <!-- js bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- main js -->
  <script src="./main.js"></script>
</body>
</html>
